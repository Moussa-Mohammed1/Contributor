# ---------------------------------------------------------------------------
# contributor configuration
# Generated by `keeper init`. Edit and re-run `keeper config validate`.
# ---------------------------------------------------------------------------

# Data directory for state database, logs, daemon pid file.
data_dir: ~/.contributor

repositories:
  - path: D:/Projects/TalentFlow
    priority: 1.0
    max_commits_per_day: 8
    preferred_provider: null
    ignore_patterns: []
  - path: D:/Projects/Portfolio
    priority: 0.8
    max_commits_per_day: 5
    preferred_provider: null
    ignore_patterns: []
  - path: D:/Projects/Restaurant
    priority: 1.2
    max_commits_per_day: 7
    preferred_provider: null
    ignore_patterns: []

schedule:
  start_date: 2026-01-20
  end_date: 2026-02-20
  timezone: Africa/Casablanca
  run_time: "08:00"
  commit_count:
    min: 1
    max: 10
  commit_interval:
    min_minutes: 20
    max_minutes: 180
  working_days:
    monday: true
    tuesday: true
    wednesday: true
    thursday: true
    friday: true
    saturday: true
    sunday: false
  branch: main
  dry_run: false
  plan_mode: natural  # natural | random | balanced | heavy | light | custom
  custom_distribution: null  # optional list of ints, e.g. [2, 4, 6, 8]

ai:
  provider: auto  # auto | openai | gemini | claude | ollama | lmstudio | openrouter
  temperature: 0.7
  max_tokens: 2048
  timeout_seconds: 120
  providers:
    openai:
      api_key: ""
      model: gpt-4o-mini
      base_url: ""
    gemini:
      api_key: ""
      model: gemini-2.0-flash
    claude:
      api_key: ""
      model: claude-3-5-haiku-latest
    ollama:
      base_url: http://localhost:11434
      model: qwen2.5-coder:7b
    lmstudio:
      base_url: http://localhost:1234/v1
      model: ""
    openrouter:
      api_key: ""
      model: meta-llama/llama-3.1-8b-instruct

safety:
  run_formatter: true
  run_linter: true
  run_tests: false
  test_timeout: 300
  max_changed_files: 15
  max_change_bytes: 512000

notifications:
  enabled: true
  desktop: true
  console: false

logging:
  level: INFO
  structured: true
  retention_days: 30

api:
  enabled: true
  host: 127.0.0.1
  port: 8971

guardrails:
  require_remote_push: true
  allow_untracked_cleanup: true
  skip_paused_repos: true